<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxipic</title>
    <!-- استدعاء مكتبة Pi SDK الرسمية -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <h2>Taxipic - Pi App</h2>
        <p>Authenticating with Pi Network...</p>
        <button id="login-btn" style="padding: 10px 20px; font-size: 16px; background-color: #7b1fa2; color: white; border: none; border-radius: 5px; cursor: pointer;">Sign in with Pi</button>
    </div>

    <script>
        // تهيئة Pi SDK (استخدم sandbox: true للتستنت أو false للميننت)
        Pi.init({ version: "2.0", sandbox: true });

        async function authWithPi() {
            try {
                const scopes = ['username', 'payments'];
                const authResult = await Pi.authenticate(scopes, onIncompletePaymentFound);
                console.log("Authentication successful", authResult);
            } catch (error) {
                console.error("Authentication error", error);
            }
        }

        function onIncompletePaymentFound(payment) {
            console.log("Incomplete payment found", payment);
        }

        // محاولة تسجيل الدخول عند الضغط أو تلقائياً
        document.getElementById('login-btn').addEventListener('click', authWithPi);
        
        // محاولة التشغيل التلقائي بعد تحميل الصفحة بثوانٍ قليلة ليراها Pi Studio
        window.onload = function() {
            setTimeout(authWithPi, 1000);
        };
    </script>
</body>
</html>
