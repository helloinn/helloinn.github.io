name: Taxipic CI

on:
  push:
    branches: [main, feature/provider-marketplace-portal]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxipic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check server and database code
        run: npm run typecheck
      - name: Run automated tests
        run: npm test
      - name: Build frontend
        run: npm run build
